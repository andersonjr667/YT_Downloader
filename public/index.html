<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🎬 YouTube Downloader</h1>
    <p>Baixe vídeos e áudios do YouTube com facilidade!</p>
  </header>

  <main class="container">
    <form id="downloadForm">
      <label for="urlInput">🔗 Link do YouTube</label>
      <input 
        type="url" 
        id="urlInput" 
        placeholder="https://youtube.com/..."
        pattern="^(https?\:\/\/)?(www\.)?(youtube\.com|youtu\.be)\/.+"
        required
      >

      <label for="formatSelect">📁 Formato de Saída</label>
      <select id="formatSelect">
        <option value="mp3">🎵 Áudio MP3</option>
        <option value="mp4">🎥 Vídeo MP4</option>
      </select>

      <button type="button" id="toggleAdvancedOptions">⚙️ Mostrar Opções Avançadas</button>

      <div id="advancedOptions" style="display: none;">
        <h3>⚙️ Opções Avançadas</h3>

        <label for="filenameInput">📝 Nome do Arquivo</label>
        <input 
          type="text" 
          id="filenameInput" 
          placeholder="Digite o nome do arquivo (opcional)"
        >

        <label for="compressionSelect">📦 Compactação</label>
        <select id="compressionSelect">
          <option value="none">Sem Compactação</option>
          <option value="zip">ZIP</option>
          <option value="7z">7z</option>
        </select>

        <label for="qualitySelect">🎥 Qualidade do Vídeo</label>
        <select id="qualitySelect">
          <option value="best">Melhor Qualidade</option>
          <option value="medium">Qualidade Média</option>
          <option value="low">Qualidade Baixa</option>
        </select>

        <label for="resolutionSelect">📏 Resolução</label>
        <select id="resolutionSelect">
          <option value="1080p">1080p</option>
          <option value="720p">720p</option>
          <option value="480p">480p</option>
          <option value="360p">360p</option>
          <option value="240p">240p</option>
        </select>

        <label for="sizeLimitInput">📂 Limite de Tamanho (MB)</label>
        <input 
          type="number" 
          id="sizeLimitInput" 
          placeholder="Exemplo: 100 (opcional)"
          min="1"
        >
      </div>

      <button type="submit">⬇️ Iniciar Download</button>
    </form>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar" style="width: 0%"></div>
    </div>

    <div id="status"></div>
  </main>

  <footer>
    <p>Desenvolvido por <strong>Você</strong>. © 2023</p>
  </footer>

  <script>
    document.getElementById('toggleAdvancedOptions').addEventListener('click', () => {
      const advancedOptions = document.getElementById('advancedOptions');
      const isVisible = advancedOptions.style.display === 'block';
      advancedOptions.style.display = isVisible ? 'none' : 'block';
      document.getElementById('toggleAdvancedOptions').textContent = isVisible
        ? '⚙️ Mostrar Opções Avançadas'
        : '⚙️ Ocultar Opções Avançadas';
    });

    document.getElementById('downloadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      const progressBar = document.getElementById("progressBar");
      
      try {
        status.innerHTML = '<div class="loading"></div> Preparando download...';
        progressBar.style.width = '30%';

        const response = await fetch(`${window.location.origin}/api/download`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            url: document.getElementById("urlInput").value.trim(),
            format: document.getElementById("formatSelect").value,
            filename: document.getElementById("filenameInput").value.trim(),
            compression: document.getElementById("compressionSelect").value,
            quality: document.getElementById("qualitySelect").value,
            resolution: document.getElementById("resolutionSelect").value,
            sizeLimit: document.getElementById("sizeLimitInput").value.trim()
          }),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Erro desconhecido no servidor');
        }
        
        const data = await response.json();
        progressBar.style.width = '100%';
        
        status.innerHTML = `
          <a href="${data.downloadUrl}" download class="download-link">
            ✅ Download completo: ${data.filename}
          </a>
        `;

      } catch (error) {
        console.error('Erro no frontend:', error.message);
        status.innerHTML = `<div style="color:#ff4444">❌ ${error.message}</div>`;
        progressBar.style.width = '0%';
      }
    });
  </script>
</body>
</html>
