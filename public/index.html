<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader - Dark Mode</title>
  <style>
    :root {
      --primary-color: #FF0000; /* Vermelho do YouTube */
      --secondary-color: #282828; /* Fundo escuro */
      --bg-color: #F9F9F9; /* Fundo claro */
      --text-color: #282828; /* Texto escuro */
      --input-bg: #FFFFFF; /* Fundo dos inputs */
      --container-bg: #FFFFFF; /* Fundo dos containers */
      --border-color: #E5E5E5; /* Bordas suaves */
      --progress-bg: #CCCCCC; /* Fundo da barra de progresso */
    }

    .light-theme {
      --bg-color: #FFFFFF; /* Fundo claro */
      --text-color: #282828; /* Texto escuro */
      --input-bg: #F9F9F9; /* Fundo dos inputs */
      --container-bg: #FFFFFF; /* Fundo dos containers */
      --border-color: #E5E5E5; /* Bordas suaves */
      --progress-bg: #CCCCCC; /* Fundo da barra de progresso */
    }

    * {
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background-color: var(--container-bg);
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin: 0 0 30px 0;
      font-size: 2.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    label {
      display: block;
      margin: 25px 0 8px 0;
      font-weight: 600;
      color: var(--text-color);
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 16px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.2);
    }

    button {
      width: 100%;
      padding: 15px;
      background: var(--primary-color);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 25px;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    #status {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .loading {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--container-bg);
      border: 2px solid var(--border-color);
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-container {
      width: 100%;
      height: 8px;
      background-color: var(--progress-bg);
      border-radius: 4px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary-color);
      transition: width 0.3s ease;
    }

    .download-link {
      display: block;
      padding: 15px;
      background-color: var(--input-bg);
      border-radius: 8px;
      text-decoration: none;
      color: var(--primary-color);
      border: 2px solid var(--border-color);
      margin-top: 15px;
      transition: transform 0.2s;
    }

    .download-link:hover {
      transform: translateX(5px);
      border-color: var(--primary-color);
    }

  </style>
</head>
<body>
  <div class="theme-toggle" onclick="toggleTheme()">🌓</div>
  
  <div class="container">
    <h1>🎬 YouTube Downloader</h1>

    <label for="urlInput">🔗 Link do YouTube</label>
    <input 
      type="url" 
      id="urlInput" 
      placeholder="https://youtube.com/..."
      pattern="^(https?\:\/\/)?(www\.)?(youtube\.com|youtu\.be)\/.+"
      required
    >

    <label for="formatSelect">📁 Formato de Saída</label>
    <select id="formatSelect">
      <option value="mp3">🎵 Áudio MP3</option>
      <option value="mp4">🎥 Vídeo MP4</option>
    </select>

    <button onclick="iniciarDownload()">⬇️ Iniciar Download</button>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar" style="width: 0%"></div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // Controle de Tema
    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      document.querySelector('.theme-toggle').textContent = isLight ? '🌙' : '🌞';
    }

    // Carregar tema salvo
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
      document.body.classList.add('light-theme');
      document.querySelector('.theme-toggle').textContent = '🌙';
    }

    // Controle de Download
    async function iniciarDownload() {
      const status = document.getElementById("status");
      const progressBar = document.getElementById("progressBar");
      
      try {
        status.innerHTML = '<div class="loading"></div> Preparando download...';
        progressBar.style.width = '30%';

        const response = await fetch(`${window.location.origin}/api/download`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            url: document.getElementById("urlInput").value.trim(),
            format: document.getElementById("formatSelect").value
          }),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Erro desconhecido no servidor');
        }
        
        const data = await response.json();
        progressBar.style.width = '100%';
        
        status.innerHTML = `
          <a href="${data.downloadUrl}" download class="download-link">
            ✅ Download completo: ${data.filename}
          </a>
        `;

      } catch (error) {
        console.error('Erro no frontend:', error.message);
        status.innerHTML = `<div style="color:#ff4444">❌ ${error.message}</div>`;
        progressBar.style.width = '0%';
      }
    }

    // Validação em tempo real
    document.getElementById('urlInput').addEventListener('input', function(e) {
      const isValid = e.target.validity.valid;
      e.target.style.borderColor = isValid ? 'var(--border-color)' : '#ff4444';
    });
  </script>
</body>
</html>
